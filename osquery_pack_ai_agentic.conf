{
  "queries": {
    "ai_agent_cli_running": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, p.path, u.username FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.name IN ('claude','gemini','codex','aider','goose','opencode','cline','grok','kiro','cn') OR p.cmdline LIKE '%@anthropic-ai/claude-code%' OR p.cmdline LIKE '%@google/gemini-cli%' OR p.cmdline LIKE '%@openai/codex%' OR p.cmdline LIKE '%aider-chat%' OR p.cmdline LIKE '%block-goose%' OR p.cmdline LIKE '%opencode-ai%'",
      "interval": 300,
      "description": "Detects running AI agent CLI processes (claude, gemini, codex, aider, goose, opencode, cline, grok, kiro). Catches agents active right now regardless of install method.",
      "snapshot": true
    },
    "ai_agent_running_bypass_permissions": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username, p.path FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE (p.name IN ('claude','gemini','codex','aider')  OR p.cmdline LIKE '%claude-code%'  OR p.cmdline LIKE '%@anthropic-ai%'  OR p.cmdline LIKE '%@openai/codex%'  OR p.cmdline LIKE '%@google/gemini-cli%') AND (p.cmdline LIKE '%--dangerously-skip-permissions%'  OR p.cmdline LIKE '%skip-permissions%'  OR p.cmdline LIKE '%--yolo%'  OR p.cmdline LIKE '%--dangerously-bypass-approvals%'  OR p.cmdline LIKE '%--full-auto%'  OR p.cmdline LIKE '%danger-full-access%'  OR p.cmdline LIKE '%--yes-always%'  OR p.cmdline LIKE '%approval-mode yolo%')",
      "interval": 300,
      "description": "HIGH RISK: AI agent process running with auto-approve / bypass-permissions flags. These disable human oversight and allow arbitrary code execution, file writes, and shell commands without confirmation. Corresponds to agentic-detector risk_flag: skip_permissions_runtime.",
      "snapshot": true
    },
    "ai_agent_tool_homes_present": {
      "query": "SELECT u.username, u.uid, f.path FROM users u JOIN file f ON (f.path = u.directory || '/.claude' OR f.path = u.directory || '/.gemini' OR f.path = u.directory || '/.codex' OR f.path = u.directory || '/.aider' OR f.path = u.directory || '/.opencode' OR f.path = u.directory || '/.grok' OR f.path = u.directory || '/.hermes' OR f.path = u.directory || '/.openclaw' OR f.path = u.directory || '/.cursor' OR f.path = u.directory || '/.continue') WHERE f.type = 'directory'",
      "interval": 3600,
      "description": "Detects AI agent tool home directories (e.g. ~/.claude, ~/.gemini, ~/.codex, ~/.grok, ~/.cursor, ~/.continue). Presence indicates an agent has been initialised even if its binary is not on PATH. Multi-signal detection anchor used by agentic-detector.",
      "snapshot": true
    },
    "ai_agent_npm_installed": {
      "query": "SELECT u.username, u.uid, f.path, f.mtime FROM users u JOIN file f ON (f.path = u.directory || '/AppData/Roaming/npm/node_modules/@anthropic-ai/claude-code/package.json' OR f.path = u.directory || '/AppData/Roaming/npm/node_modules/@google/gemini-cli/package.json' OR f.path = u.directory || '/AppData/Roaming/npm/node_modules/@openai/codex/package.json' OR f.path = u.directory || '/.npm-global/lib/node_modules/@anthropic-ai/claude-code/package.json' OR f.path = u.directory || '/.npm-global/lib/node_modules/@google/gemini-cli/package.json' OR f.path = u.directory || '/.bun/install/global/node_modules/@anthropic-ai/claude-code/package.json')",
      "interval": 3600,
      "description": "Detects npm-installed AI agent packages (claude-code, gemini-cli, codex) via their package.json manifests in global node_modules directories. Covers Windows (AppData/Roaming/npm) and Linux/macOS (.npm-global, .bun) paths.",
      "snapshot": true
    },
    "ai_agent_pipx_installed": {
      "query": "SELECT u.username, u.uid, f.path FROM users u JOIN file f ON (f.path = u.directory || '/.local/pipx/venvs/aider-chat' OR f.path = u.directory || '/.local/pipx/venvs/llm' OR f.path = u.directory || '/.local/pipx/venvs/fabric') WHERE f.type = 'directory'",
      "interval": 3600,
      "description": "Detects Python-based AI agent CLIs installed via pipx: aider-chat, LLM CLI, Fabric. These run as isolated venvs under ~/.local/pipx/venvs.",
      "snapshot": true
    },
    "ai_agent_claude_permission_mode": {
      "query": "SELECT u.username, u.uid, f.path, f.size, f.mtime, hash.sha256 FROM users u JOIN file f ON (f.path = u.directory || '/.claude/settings.json' OR f.path = u.directory || '/.claude/settings.local.json') JOIN hash ON hash.path = f.path WHERE f.size > 0",
      "interval": 3600,
      "description": "Identifies Claude Code settings files where bypassPermissions or acceptEdits autonomy mode may be configured. Inspect permissions.defaultMode in the JSON. 'bypassPermissions' = risk_flag: bypass_permissions; 'acceptEdits' = risk_flag: auto_accept_edits. SHA256 tracks setting changes.",
      "snapshot": true
    },
    "mcp_config_files_present": {
      "query": "SELECT u.username, u.uid, f.path, f.size, f.mtime, hash.sha256 FROM users u JOIN file f ON (f.path = u.directory || '/.claude.json' OR f.path = u.directory || '/.mcp.json' OR f.path = u.directory || '/.claude/settings.json' OR f.path = u.directory || '/.cursor/mcp.json' OR f.path = u.directory || '/.codeium/windsurf/mcp_config.json' OR f.path = u.directory || '/.gemini/config/mcp_config.json' OR f.path = u.directory || '/.grok/config.toml' OR f.path = u.directory || '/.codex/config.toml' OR f.path = u.directory || '/.continue/config.yaml' OR f.path = u.directory || '/.hermes/config.yaml' OR f.path = u.directory || '/AppData/Roaming/Claude/claude_desktop_config.json' OR f.path = u.directory || '/AppData/Roaming/Code/User/mcp.json' OR f.path = u.directory || '/AppData/Roaming/Cursor/User/mcp.json' OR f.path = u.directory || '/AppData/Roaming/Jan/data/mcp_config.json') JOIN hash ON hash.path = f.path WHERE f.size > 0",
      "interval": 3600,
      "description": "Detects MCP server configuration files across all major AI clients: Claude Desktop/Code, Cursor, Windsurf, Gemini CLI, Grok, Codex, Continue, Hermes, VS Code, Jan. SHA256 enables config change detection / rug-pull alerting.",
      "snapshot": true
    },
    "mcp_server_process_running": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username, p.path FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.cmdline LIKE '%modelcontextprotocol%' OR p.cmdline LIKE '%mcp-server%' OR p.cmdline LIKE '%mcp_server%' OR p.cmdline LIKE '%@modelcontextprotocol/%' OR p.cmdline LIKE '%mcp-server-commands%' OR p.cmdline LIKE '%desktop-commander%' OR p.cmdline LIKE '%server-shell%' OR p.cmdline LIKE '%iterm-mcp%' OR p.cmdline LIKE '%server-filesystem%'",
      "interval": 300,
      "description": "Detects running MCP server processes via command-line markers. Catches stdio MCP servers spawned as subprocesses by AI clients. Matches agentic-detector cmdline_markers.",
      "snapshot": true
    },
    "mcp_high_risk_shell_exec": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username, p.path FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.cmdline LIKE '%mcp-server-commands%' OR p.cmdline LIKE '%server-shell%' OR p.cmdline LIKE '%mcp-shell%' OR p.cmdline LIKE '%iterm-mcp%' OR p.cmdline LIKE '%desktop-commander%'",
      "interval": 300,
      "description": "HIGH RISK: Running MCP servers with shell-exec capability: mcp-server-commands, server-shell, iterm-mcp, desktop-commander. These grant the connected AI agent the ability to run arbitrary shell commands on the host. Agentic-detector capability: shell-exec.",
      "snapshot": true
    },
    "mcp_high_risk_infra_control": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.cmdline LIKE '%mcp-server-docker%' OR p.cmdline LIKE '%mcp-server-kubernetes%' OR p.cmdline LIKE '%server-github%' OR p.cmdline LIKE '%server-gitlab%' OR p.cmdline LIKE '%mcp-server-git%' OR p.cmdline LIKE '%server-postgres%' OR p.cmdline LIKE '%mcp-server-mysql%'",
      "interval": 300,
      "description": "HIGH RISK: Running MCP servers with infrastructure or repo-write capabilities: Docker, Kubernetes, GitHub/GitLab, Git, Postgres, MySQL. Agentic-detector capability flags: infra-control, repo-write, db, network.",
      "snapshot": true
    },
    "mcp_npx_uvx_remote_exec": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE (p.cmdline LIKE '%npx%' OR p.cmdline LIKE '%uvx%') AND (p.cmdline LIKE '%mcp%' OR p.cmdline LIKE '%modelcontextprotocol%')",
      "interval": 300,
      "description": "Detects MCP servers launched via npx or uvx (on-demand remote package execution). An unpinned npx/uvx invocation fetches and executes a remote package at runtime \u2014 a supply-chain risk. Agentic-detector risk_flag: remote_fetch_exec.",
      "snapshot": true
    },
    "mcp_cline_roo_settings": {
      "query": "SELECT u.username, u.uid, f.path, f.size, f.mtime, hash.sha256 FROM users u JOIN file f ON (f.path = u.directory || '/AppData/Roaming/Code/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json' OR f.path = u.directory || '/AppData/Roaming/Code/User/globalStorage/rooveterinaryinc.roo-cline/settings/mcp_settings.json' OR f.path = u.directory || '/AppData/Roaming/Cursor/User/globalStorage/saoudrizwan.claude-dev/settings/cline_mcp_settings.json' OR f.path = u.directory || '/.cline/data/settings/cline_mcp_settings.json') JOIN hash ON hash.path = f.path WHERE f.size > 0",
      "interval": 3600,
      "description": "Detects Cline and Roo-Cline MCP settings files in VS Code / Cursor globalStorage. These autonomous coding extensions can invoke MCP tools. SHA256 tracks config changes.",
      "snapshot": true
    },
    "local_llm_server_running": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username, p.path FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE p.name IN ('ollama','lms') OR p.cmdline LIKE '%lm-studio%' OR p.cmdline LIKE '%lmstudio%' OR p.cmdline LIKE '%llama.cpp%' OR p.cmdline LIKE '%llama-server%' OR (p.cmdline LIKE '%vllm%' AND p.cmdline LIKE '%serve%') OR (p.cmdline LIKE '%ollama%' AND p.cmdline LIKE '%serve%')",
      "interval": 300,
      "description": "Detects running local LLM inference servers: Ollama, LM Studio, llama.cpp, vLLM. These expose a local HTTP API (ports 11434/1234/1337) that any process on the host can query without authentication.",
      "snapshot": true
    },
    "local_llm_inference_ports_listening": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, lp.port, lp.address, lp.protocol, u.username FROM processes p JOIN listening_ports lp ON lp.pid = p.pid LEFT JOIN users u ON p.uid = u.uid WHERE lp.port IN (11434, 1234, 1337) AND (p.name IN ('ollama','lms')  OR p.cmdline LIKE '%ollama%'  OR p.cmdline LIKE '%lm-studio%'  OR p.cmdline LIKE '%lmstudio%'  OR p.cmdline LIKE '%llama%'  OR p.cmdline LIKE '%vllm%')",
      "interval": 300,
      "description": "Detects local LLM servers actively listening on well-known AI inference API ports: 11434 (Ollama), 1234 (LM Studio), 1337 (Jan). Any local process can query these APIs unauthenticated. Agentic-detector local_ports catalog.",
      "snapshot": true
    },
    "ai_desktop_app_running": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, p.uid, u.username FROM processes p LEFT JOIN users u ON p.uid = u.uid WHERE lower(p.name) IN ('claude','chatgpt','cursor','windsurf','perplexity','jan','lm studio','lmstudio','msty','anythingllm','gpt4all','comet','dia','antigravity','trae') OR lower(p.path) LIKE '%/claude.app/%' OR lower(p.path) LIKE '%/chatgpt.app/%' OR lower(p.path) LIKE '%\\\\appdata\\\\local\\\\programs\\\\claude\\\\%' OR lower(p.path) LIKE '%\\\\appdata\\\\local\\\\programs\\\\chatgpt\\\\%'",
      "interval": 600,
      "description": "Detects running AI desktop applications: Claude Desktop, ChatGPT, Cursor, Windsurf, Perplexity, Jan, LM Studio, Msty, AnythingLLM, GPT4All, Comet (AI browser by Perplexity), Dia (Browser Company AI browser), Antigravity, Trae.",
      "snapshot": true
    },
    "ai_desktop_app_installed_windows": {
      "query": "SELECT name, version, install_location, install_date, publisher FROM programs WHERE lower(name) LIKE '%claude%' OR lower(name) LIKE '%chatgpt%' OR lower(name) LIKE '%cursor%' OR lower(name) LIKE '%windsurf%' OR lower(name) LIKE '%lm studio%' OR lower(name) LIKE '%lmstudio%' OR lower(name) LIKE '%ollama%' OR lower(name) LIKE '%gpt4all%' OR lower(name) LIKE '%msty%' OR lower(name) LIKE '%anythingllm%' OR lower(name) LIKE '%perplexity%' OR lower(name) LIKE '%jan.app%' OR lower(name) LIKE '%antigravity%'",
      "interval": 3600,
      "platform": "windows",
      "description": "Windows: scans the Add/Remove Programs registry for installed AI desktop applications. Catches apps not running at scan time.",
      "snapshot": true
    },
    "ai_vscode_extension_installed": {
      "query": "SELECT u.username, u.uid, f.path, f.mtime FROM users u JOIN file f ON (f.path LIKE u.directory || '/.vscode/extensions/github.copilot-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/github.copilot-chat-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/saoudrizwan.claude-dev-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/anthropic.claude-code-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/continue.continue-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/rooveterinaryinc.roo-cline-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/kilocode.kilo-code-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/augment.vscode-augment-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/codeium.codeium-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/exafunction.windsurf-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/windsurf.windsurf-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/tabnine.tabnine-vscode-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/amazonwebservices.amazon-q-vscode-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/sourcegraph.cody-ai-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/google.geminicodeassist-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/danielsanmedium.dscodegpt-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/blackboxapp.blackbox-%/package.json' OR f.path LIKE u.directory || '/.vscode/extensions/sourcery.sourcery-%/package.json')",
      "interval": 3600,
      "description": "Detects AI coding extensions installed in VS Code (Cursor and Windsurf share this directory): GitHub Copilot, Cline (claude-dev), Roo-Cline, KiloCode, Continue, Augment, Codeium, Windsurf, Tabnine, Amazon Q, Cody, Gemini Code Assist, Blackbox, Sourcery. Extension IDs sourced from agentic-detector kb.json plugin_ids.",
      "snapshot": true
    },
    "ai_instruction_files_present": {
      "query": "SELECT u.username, u.uid, f.path, f.size, f.mtime, hash.sha256 FROM users u JOIN file f ON (f.path LIKE u.directory || '%/CLAUDE.md' OR f.path LIKE u.directory || '%/CLAUDE.local.md' OR f.path LIKE u.directory || '%/AGENTS.md' OR f.path LIKE u.directory || '%/GEMINI.md' OR f.path LIKE u.directory || '%/.cursorrules' OR f.path LIKE u.directory || '%/.windsurfrules' OR f.path LIKE u.directory || '%/.clinerules' OR f.path LIKE u.directory || '%/.roorules' OR f.path LIKE u.directory || '%/.github/copilot-instructions.md' OR f.path = u.directory || '/.claude.md') JOIN hash ON hash.path = f.path WHERE f.size > 0",
      "interval": 3600,
      "description": "Inventories agent instruction files auto-loaded and obeyed by AI agents: CLAUDE.md, AGENTS.md, GEMINI.md, .cursorrules, .windsurfrules, .clinerules, .roorules, copilot-instructions.md. These are a prompt-injection / agent-hijack surface. SHA256 enables change detection. Sourced from agentic-detector instructions.go projectFiles.",
      "snapshot": true
    },
    "ai_instruction_files_recently_modified": {
      "query": "SELECT u.username, u.uid, f.path, f.size, f.mtime, hash.sha256 FROM users u JOIN file f ON (f.path LIKE u.directory || '%/CLAUDE.md' OR f.path LIKE u.directory || '%/AGENTS.md' OR f.path LIKE u.directory || '%/GEMINI.md' OR f.path LIKE u.directory || '%/.cursorrules' OR f.path LIKE u.directory || '%/.github/copilot-instructions.md') JOIN hash ON hash.path = f.path WHERE f.size > 0 AND f.mtime > (strftime('%s','now') - 86400)",
      "interval": 3600,
      "description": "Detects AI agent instruction files modified within the last 24 hours. An unexpected change to CLAUDE.md or AGENTS.md in a project repo may indicate prompt injection being planted. Alert on SHA256 changes between scan runs.",
      "snapshot": true
    },
    "ai_agent_outbound_connections": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username, s.remote_address, s.remote_port FROM processes p JOIN process_open_sockets s ON s.pid = p.pid LEFT JOIN users u ON p.uid = u.uid WHERE s.state = 'ESTABLISHED' AND NOT (s.remote_address LIKE '127.%' OR s.remote_address = '::1') AND (p.name IN ('claude','gemini','codex','aider','goose','opencode','cline','grok')  OR p.cmdline LIKE '%@anthropic-ai/claude-code%'  OR p.cmdline LIKE '%@google/gemini-cli%'  OR p.cmdline LIKE '%@openai/codex%'  OR p.cmdline LIKE '%aider-chat%')",
      "interval": 300,
      "description": "Detects active outbound network connections from known AI agent CLI processes to non-loopback destinations. Identifies which agents are communicating externally right now.",
      "snapshot": true
    },
    "mcp_remote_server_connections": {
      "query": "SELECT p.pid, p.name, p.cmdline, p.uid, u.username, s.remote_address, s.remote_port FROM processes p JOIN process_open_sockets s ON s.pid = p.pid LEFT JOIN users u ON p.uid = u.uid WHERE s.state = 'ESTABLISHED' AND NOT (s.remote_address LIKE '127.%' OR s.remote_address = '::1') AND (p.cmdline LIKE '%modelcontextprotocol%'  OR p.cmdline LIKE '%mcp-server%'  OR p.cmdline LIKE '%streamable-http%'  OR p.cmdline LIKE '%mcp-remote%')",
      "interval": 300,
      "description": "Detects outbound connections from MCP-related processes to non-loopback destinations. Catches remote MCP server usage over HTTP/SSE/streamable-http. Agentic-detector category: mcp-remote-egress.",
      "snapshot": true
    },
    "local_mcp_server_listening": {
      "query": "SELECT p.pid, p.name, p.path, p.cmdline, lp.port, lp.address, lp.protocol, u.username FROM processes p JOIN listening_ports lp ON lp.pid = p.pid LEFT JOIN users u ON p.uid = u.uid WHERE lp.port NOT IN (11434, 1234, 1337) AND (p.cmdline LIKE '%modelcontextprotocol%'  OR p.cmdline LIKE '%mcp-server%'  OR p.cmdline LIKE '%mcp_server%'  OR p.cmdline LIKE '%server-filesystem%'  OR p.cmdline LIKE '%desktop-commander%'  OR p.cmdline LIKE '%server-shell%')",
      "interval": 300,
      "description": "Detects locally-bound MCP server listeners on non-inference ports. A locally-bound MCP server is accessible to any process on the host without authentication. Agentic-detector category: mcp-server-local.",
      "snapshot": true
    },
    "ai_chrome_extension_installed_windows": {
      "query": "SELECT u.username, u.uid, f.path, f.mtime FROM users u JOIN file f ON (f.path LIKE u.directory || '/AppData/Local/Google/Chrome/User Data/Default/Extensions/mfgnpcdebmgmmbjmhmboieiipghabkjf/%' OR f.path LIKE u.directory || '/AppData/Local/Google/Chrome/User Data/Default/Extensions/ofpnmcalabcbjgholdjcjblkibolbppb/%' OR f.path LIKE u.directory || '/AppData/Local/Google/Chrome/User Data/Default/Extensions/cifagnnjkogmgddhpamfjdpmligkmmgi/%' OR f.path LIKE u.directory || '/AppData/Local/Microsoft/Edge/User Data/Default/Extensions/mfgnpcdebmgmmbjmhmboieiipghabkjf/%' OR f.path LIKE u.directory || '/AppData/Local/Microsoft/Edge/User Data/Default/Extensions/ofpnmcalabcbjgholdjcjblkibolbppb/%') WHERE f.type = 'directory'",
      "interval": 3600,
      "platform": "windows",
      "description": "Windows: Detects known AI browser extensions in Chrome and Edge by extension ID. IDs from agentic-detector kb.json browser_extension_ids: mfgnp... (chat), ofpnm... (ai-assistant), cifag... (ai-assistant). Covers Chrome and Edge Chromium paths.",
      "snapshot": true
    }
  }
}